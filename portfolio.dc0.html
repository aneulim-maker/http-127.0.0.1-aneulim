/* ── MODE 전환 ── */
var currentMode = 'orbit';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('section-orbit').style.display = mode === 'orbit' ? '' : 'none';
  document.getElementById('section-timeline').style.display = mode === 'timeline' ? '' : 'none';
  document.getElementById('section-editorial').style.display = mode === 'editorial' ? '' : 'none';
}

function scrollToTop() {
  window.scrollTo({top:0, behavior:'smooth'});
}

function onOrbit() {
  var wasOrbit = currentMode === 'orbit';
  setMode('orbit');
  if (!wasOrbit) { scrollToTop(); return; }
  var card = document.querySelector('.career-card');
  if (card) card.scrollIntoView({behavior:'smooth', block:'center'});
}

function onTimeline() {
  setMode('timeline');
  /* CAREER TIMELINE 헤더 위치로 스크롤 */
  setTimeout(function() {
    var sec = document.getElementById('section-timeline');
    if (sec) {
      var top = sec.getBoundingClientRect().top + (document.scrollingElement||document.documentElement).scrollTop;
      window.scrollTo({top: Math.max(0, top - 80), behavior:'smooth'});
    }
  }, 60);
}

function onEditorial() {
  setMode('editorial');
  /* PORTFOLIO LOOKBOOK 헤더 위치로 스크롤 */
  setTimeout(function() {
    var sec = document.getElementById('section-editorial');
    if (sec) {
      var top = sec.getBoundingClientRect().top + (document.scrollingElement||document.documentElement).scrollTop;
      window.scrollTo({top: Math.max(0, top - 80), behavior:'smooth'});
    }
  }, 60);
}

function scrollTopBtn() { scrollToTop(); }

/* ── reveal 옵저버 ── */
function setupReveal(els) {
  if (!els || !els.length || typeof IntersectionObserver === 'undefined') return;
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.style.opacity = '1';
        e.target.style.transform = 'none';
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  Array.from(els).forEach(function(el) {
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px)';
    el.style.transition = 'opacity .75s cubic-bezier(.2,0,.1,1), transform .75s cubic-bezier(.2,0,.1,1)';
    io.observe(el);
  });
}

/* ══════════ 아이소메트릭 3D E 로고 지오메트리 (Python 렌더로 검증된 좌표계) ══════════
   World: u(화면 우하), v(화면 좌하), z(위)  /  X=(u-v)A+CX, Y=(u+v)B-zS+CY            */
var ISO = (function () {
  var S = 26.0, A = S * Math.sqrt(3) / 2, B = S * 0.5;
  var W = 10.0, HC = 8.5, HE = 2.0, GAP0 = 1.3;   // 큐브폭·큐브높이·E두께·시작 부양높이
  var CX = 380.0, CY = 430.0;                       // 바닥(z=0) 앵커

  var E_LOCAL = [[0,0],[10,0],[10,2.4],[2.6,2.4],[2.6,4.15],[8.7,4.15],
                 [8.7,5.85],[2.6,5.85],[2.6,7.6],[10,7.6],[10,10],[0,10]];
  var E = E_LOCAL.map(function (p) { return [p[0], 10 - p[1]]; });

  function P(u, v, z) { return [(u - v) * A + CX, (u + v) * B - z * S + CY]; }
  function path(pts, close) {
    var d = 'M' + pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' L');
    return close === false ? d : d + ' Z';
  }
  function sideFaces(poly, z0, z1) {           // 보이는 돌출 측면 (painter: 먼 것부터)
    var fs = [], n = poly.length;
    for (var i = 0; i < n; i++) {
      var p = poly[i], q = poly[(i + 1) % n];
      var du = q[0] - p[0], dv = q[1] - p[1];
      var nu = dv, nv = -du;                   // CCW 외향 법선
      if (nu + nv <= 1e-9) continue;
      fs.push({ depth: (p[0] + p[1] + q[0] + q[1]) / 2,
                pts: [P(p[0],p[1],z1), P(q[0],q[1],z1), P(q[0],q[1],z0), P(p[0],p[1],z0)],
                facing: nu > nv ? 'u' : 'v' });
    }
    fs.sort(function (a, b) { return a.depth - b.depth; });
    return fs;
  }

  /* 면 위 데이터 바 패턴 (face-local: p 가로, q 위→아래) */
  var LB = [[0.85,0.6,0.85,2.6],[0.85,3.9,0.85,0.85],[2.35,1.4,0.85,4.6],
            [3.85,0.6,0.85,0.85],[3.85,2.2,0.85,3.4],[5.35,0.9,0.85,2.2],
            [5.35,3.8,0.85,2.6],[6.85,1.6,0.85,5.0],[8.3,0.7,0.85,0.85],[8.3,2.3,0.85,2.7]];
  var RB = [[0.9,1.0,0.85,3.2],[2.4,0.7,0.85,0.85],[2.4,2.3,0.85,3.9],
            [6.55,0.8,0.85,1.9],[6.55,3.4,0.85,3.0],[8.1,1.4,0.85,0.85],[8.1,3.0,0.85,2.3]];
  function bars(bs) {
    return bs.map(function (b) {
      return '<rect x="'+b[0]+'" y="'+b[1]+'" width="'+b[2]+'" height="'+b[3]+'" rx="'+(b[2]/2)+'" fill="#2ad4e0" opacity="0.95"/>';
    }).join('');
  }
  var PCT = '<circle cx="4.8" cy="1.55" r="0.5" fill="none" stroke="#2ad4e0" stroke-width="0.4"/>'
          + '<circle cx="6.2" cy="3.45" r="0.5" fill="none" stroke="#2ad4e0" stroke-width="0.4"/>'
          + '<line x1="6.35" y1="1.15" x2="4.65" y2="3.85" stroke="#2ad4e0" stroke-width="0.4" stroke-linecap="round"/>';

  /* t: 0(공중 부양 플랫 E) → 1(완성) */
  function build(t) {
    var hc = HC * t;
    var gap = GAP0 * (1 - t);        // 부양 간격이 서서히 닫히며 큐브 위에 착지
    var z0 = hc + gap, z1 = z0 + HE;
    var s = '<defs><linearGradient id="eTopG" x1="0" y1="0" x2="1" y2="1">'
          + '<stop offset="0" stop-color="#8bf7ee"/><stop offset="0.45" stop-color="#3ce9e2"/><stop offset="1" stop-color="#22cbe0"/>'
          + '</linearGradient><radialGradient id="eFloorG" cx="0.5" cy="0.5" r="0.5">'
          + '<stop offset="0" stop-color="#1de0e6" stop-opacity="0.30"/><stop offset="1" stop-color="#1de0e6" stop-opacity="0"/>'
          + '</radialGradient></defs>';
    var gw = 230 + 50 * t;
    s += '<ellipse cx="' + CX + '" cy="' + (CY + W * B + 8) + '" rx="' + gw.toFixed(0) + '" ry="' + (gw / 6.5).toFixed(0) + '" fill="url(#eFloorG)"/>';

    if (hc > 0.03) {                 // ── 베이스 큐브 (바닥에서 성장) ──
      var lf = [P(0,W,hc), P(W,W,hc), P(W,W,0), P(0,W,0)];
      var rf = [P(W,0,hc), P(W,W,hc), P(W,W,0), P(W,0,0)];
      var tp = [P(0,0,hc), P(W,0,hc), P(W,W,hc), P(0,W,hc)];
      s += '<path d="' + path(lf) + '" fill="#0d1a2c"/>';
      s += '<path d="' + path(rf) + '" fill="#101f34"/>';
      s += '<path d="' + path(tp) + '" fill="#142438"/>';
      s += '<clipPath id="eClipL"><path d="' + path(lf) + '"/></clipPath>';
      s += '<clipPath id="eClipR"><path d="' + path(rf) + '"/></clipPath>';
      var oL = P(0, W, hc), oR = P(W, 0, hc);   // 각 면의 위쪽 먼 모서리 = 바 좌표 원점
      s += '<g clip-path="url(#eClipL)"><g transform="matrix(' + A.toFixed(4) + ',' + B.toFixed(4) + ',0,' + S + ',' + oL[0].toFixed(2) + ',' + oL[1].toFixed(2) + ')">' + bars(LB) + '</g></g>';
      s += '<g clip-path="url(#eClipR)"><g transform="matrix(' + (-A).toFixed(4) + ',' + B.toFixed(4) + ',0,' + S + ',' + oR[0].toFixed(2) + ',' + oR[1].toFixed(2) + ')">' + bars(RB) + PCT + '</g></g>';
      s += '<path d="' + path([P(0,W,hc), P(W,W,hc), P(W,0,hc)], false) + '" fill="none" stroke="#1de0e6" stroke-opacity="0.28" stroke-width="1.3"/>';
    }

    /* ── E (돌출체) ── */
    sideFaces(E, z0, z1).forEach(function (f) {
      s += '<path d="' + path(f.pts) + '" fill="' + (f.facing === 'u' ? '#0f95a8' : '#0b6d84') + '"/>';
    });
    s += '<path d="' + path(E.map(function (p) { return P(p[0], p[1], z1); })) + '" fill="url(#eTopG)"/>';
    return s;
  }
  return { build: build };
})();

/* ── E 로고 IntersectionObserver — 스크롤 재진입마다 애니메이션 재실행 ── */
function setupCloseSphere() {
  var wrap  = document.querySelector('.close-logo-wrap');
  var logo  = document.getElementById('closeELogo');
  var text  = document.querySelector('.close-text');
  var email = document.querySelector('.close-email');
  if (!wrap) return;

  var DUR = 2400, rafId = null;
  var ease = function (t) { return 1 - Math.pow(1 - t, 5); };  // easeOutQuint
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (logo) { logo.innerHTML = ISO.build(0); logo.style.transition = 'opacity .45s ease'; }

  function playAnim() {
    if (rafId) cancelAnimationFrame(rafId);
    [text, email].forEach(function (el) {
      if (el) { el.style.animation = 'none'; el.style.opacity = '0'; }
    });
    void wrap.offsetWidth; /* force reflow */
    if (text)  text.style.animation  = 'eTextFade 1.0s cubic-bezier(.2,0,.1,1) 2.0s both';
    if (email) email.style.animation = 'eTextFade 1.0s cubic-bezier(.2,0,.1,1) 2.3s both';
    if (!logo) return;

    logo.style.animation = 'none';
    logo.style.opacity = '1';
    logo.style.filter = 'drop-shadow(0 0 18px rgba(0,225,242,0.45))';

    if (reduced) {                                  // 모션 최소화: 완성 상태로 바로
      logo.innerHTML = ISO.build(1);
      logo.style.animation = 'eLogoPulse 3s ease-in-out infinite';
      return;
    }
    var t0 = performance.now();
    (function tick(now) {
      var raw = Math.min((now - t0) / DUR, 1);
      logo.innerHTML = ISO.build(ease(raw));
      if (raw < 1) { rafId = requestAnimationFrame(tick); }
      else {                                        // 착지 → 글로우 펄스
        logo.style.filter = '';
        logo.style.animation = 'eLogoPulse 3s ease-in-out infinite';
        rafId = null;
      }
    })(t0);
  }
  function hideAnim() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    [text, email].forEach(function (el) {
      if (el) { el.style.animation = 'none'; el.style.opacity = '0'; }
    });
    if (logo) {
      logo.style.animation = 'none';
      logo.style.opacity = '0';
      logo.innerHTML = ISO.build(0);                // 다음 진입을 위해 부양 상태로 리셋
    }
  }

  if (typeof IntersectionObserver === 'undefined') { playAnim(); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) playAnim(); else hideAnim();
    });
  }, { threshold: 0.25 });
  io.observe(wrap);
}

/* ── 초기화 ── */
document.addEventListener('DOMContentLoaded', function() {
  renderCareers();
  renderTimeline();
  renderLookbook();
  setMode('orbit');
  setupReveal(document.querySelectorAll('[data-reveal]'));
  setupCloseSphere();
});
</script>

<script>
/* ── 파편 조각 애니메이션 ── */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var SHAPES = [
    '0,-12 10,6 -10,6',
    '-3,-14 11,3 5,14 -9,5',
    '0,-18 4,18 -4,18',
    '-9,-4 11,-2 6,11 -6,9',
    '0,-10 8,0 0,10 -8,0',
    '-4,-15 10,4 -9,4',
    '0,-7 15,2 8,11 -4,10 -10,2',
    '-2,-13 9,3 5,15 -10,7',
    '0,-6 7,3 -7,3',
    '-5,-9 11,-3 7,10 -8,8',
    '0,-20 3,20 -3,20',
    '-8,-2 10,-6 5,12 -4,10',
    '0,-8 8,8 -8,8',
    '-6,-10 6,-10 10,6 0,12 -10,6',
  ];
  var COLORS = [
    '#dde8f0','#f0e8e4','#f5f0eb',
    '#e8e2f0','#e0edea','#f2f0f5',
    '#f0ede2','#dde8f0','#ede8e0',
    '#f5f5f4','#e2eee8','#ece2f0',
  ];
  var SHARDS = [
    [-168,-98, 0,0,   4600,0.75, 0.045,-18,0],
    [ 125,-200,2,680, 3800,0.65,-0.06,  14,2],
    [-240, 25, 3,1450,5300,0.70, 0.038,-22,1],
    [ 200,-72, 1,300, 4900,0.68,-0.05,  18,4],
    [ -98, 172,4,1100,4100,0.62, 0.055,-12,6],
    [ 222, 100,5,1950,4600,0.72,-0.04,  16,0],
    [  68, 232,6,500, 5500,0.58, 0.062, 10,7],
    [-222,-120,7,1800,4200,0.66,-0.048,-20,3],
    [ 162, 188,8,250, 5100,0.60, 0.042, 15,1],
    [-125,-222,9,1300,4400,0.64,-0.057,-16,5],
    [ 242,-105,10,850,4000,0.70, 0.035, 20,8],
    [-188, 152,11,2100,4700,0.66,-0.043,-18,9],
    [ -40,-258,0,1600,5200,0.56, 0.058,  8,2],
    [ 252,  40,3,960, 4500,0.68,-0.052, 22,11],
    [-145, -60,5,420, 3900,0.62, 0.040,-14,10],
    [  90,-172,1,1720,4800,0.58,-0.065, 12,0],
    [-272, -30,4,2350,5600,0.54, 0.032,-24,6],
    [ 178,-142,6,780, 4300,0.64,-0.048, 16,3],
    [ -55, 245,13,1120,4900,0.50, 0.052,-10,7],
    [ 132, -88,2,2600,5100,0.60,-0.038, 14,4],
  ];
  var TRAVEL = 100;

  function init(){
    var container = document.getElementById('riseLines');
    if(!container){ setTimeout(init,60); return; }
    var items = SHARDS.map(function(d){
      var poly = document.createElementNS(NS,'polygon');
      poly.setAttribute('points',SHAPES[d[2]]);
      poly.setAttribute('fill',COLORS[d[8]]);
      poly.setAttribute('fill-opacity','0');
      container.appendChild(poly);
      return { el:poly, cx:d[0],cy:d[1], delay:d[3],cycle:d[4],opMax:d[5], rotSpd:d[6],driftX:d[7], rot0:Math.random()*360 };
    });
    var t0=null;
    function tick(ts){
      if(!t0) t0=ts;
      var elapsed=ts-t0;
      items.forEach(function(it){
        var raw=elapsed-it.delay;
        if(raw<0) raw+=it.cycle*Math.ceil(-raw/it.cycle);
        var p=(raw%it.cycle)/it.cycle;
        var yOff=TRAVEL*(0.35-p);
        var xOff=it.driftX*Math.sin(p*Math.PI);
        var rot=(it.rot0+elapsed*it.rotSpd)%360;
        var op=Math.sin(p*Math.PI)*it.opMax;
        it.el.setAttribute('transform','translate('+(it.cx+xOff).toFixed(1)+','+(it.cy+yOff).toFixed(1)+') rotate('+rot.toFixed(1)+')');
        it.el.setAttribute('fill-opacity',op.toFixed(3));
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

<script>
/* ── 텍스트 노드 공전 애니메이션 ── */
(function(){
  var NS='http://www.w3.org/2000/svg';
  var RINGS=[
    {r:175,period:22000,dir: 1,cosP:0.9511,sinP:0.3090},
    {r:212,period:17000,dir:-1,cosP:0.9135,sinP:0.4067},
    {r:250,period:12000,dir: 1,cosP:0.9659,sinP:0.2588},
  ];
  var LABEL_W={'PLANNING':92,'CONTENT':82,'LMS':44,'EDUTECH':82,'AI':34,'GROWTH':72};
  var NODES=[
    {label:'PLANNING',ring:0,angle0:0},
    {label:'CONTENT', ring:0,angle0:Math.PI},
    {label:'LMS',     ring:1,angle0:1.047},
    {label:'EDUTECH', ring:1,angle0:1.047+Math.PI},
    {label:'AI',      ring:2,angle0:2.094},
    {label:'GROWTH',  ring:2,angle0:2.094+Math.PI},
  ];
  var PH=23;

  function init(){
    var container=document.getElementById('orbitNodes');
    if(!container){ setTimeout(init,60); return; }
    var items=NODES.map(function(n){
      var w=LABEL_W[n.label]||60;
      var g=document.createElementNS(NS,'g');
      var rect=document.createElementNS(NS,'rect');
      rect.setAttribute('x',-(w/2)); rect.setAttribute('y',-(PH/2));
      rect.setAttribute('width',w); rect.setAttribute('height',PH);
      rect.setAttribute('rx',PH/2);
      rect.setAttribute('fill','rgba(255,255,255,0.07)');
      rect.setAttribute('stroke','rgba(255,255,255,0.28)');
      rect.setAttribute('stroke-width','0.7');
      var txt=document.createElementNS(NS,'text');
      txt.setAttribute('x','0'); txt.setAttribute('y','4');
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('font-family','Pretendard,sans-serif');
      txt.setAttribute('font-size','11'); txt.setAttribute('font-weight','600');
      txt.setAttribute('letter-spacing','1.8');
      txt.setAttribute('fill','rgba(255,255,255,0.9)');
      txt.textContent=n.label;
      g.appendChild(rect); g.appendChild(txt);
      container.appendChild(g);
      return {g:g, ring:RINGS[n.ring], angle0:n.angle0};
    });

    var t0=null;
    function tick(ts){
      if(!t0) t0=ts;
      var elapsed=ts-t0;
      items.forEach(function(it){
        var ring=it.ring;
        var theta=it.angle0+ring.dir*(elapsed/ring.period)*2*Math.PI;
        var x=ring.r*Math.cos(theta);
        var y=ring.r*Math.sin(theta)*ring.cosP;
        var depth=0.5+0.5*Math.sin(theta);
        var op=(0.32+0.68*depth).toFixed(3);
        it.g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
        it.g.setAttribute('opacity',op);
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
